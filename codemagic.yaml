workflows:
  android-workflow:
    name: Dave AI Android Build
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Set SDK to 36
        script: |
          # Force compileSdk 36 for all gradle files
          find . -name "build.gradle" -exec sed -i 's/compileSdkVersion [0-9][0-9]/compileSdkVersion 36/g' {} \;
          find . -name "build.gradle" -exec sed -i 's/targetSdkVersion [0-9][0-9]/targetSdkVersion 36/g' {} \;
      - name: Get Flutter packages
        script: |
          flutter pub upgrade --major-versions
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
